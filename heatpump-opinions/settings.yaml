# Settings for the heat pump adoption simulation.
# Every tunable knob for the model lives here so runs are reproducible
# and so alternative scenarios can be explored without touching code.
# Dynamics values are the calibrated prototype from the October exploration
# (analysis/negative_wom/RESULTS.md, tables 5-8): PLACEHOLDERS throughout,
# calibrated only to one rough install rate.

simulation:
  months: 300          # one step is one month; 300 = 25 years
  random_seed: 42

households:
  n_households: 100
  space_size: [1.0, 1.0]     # width, height of the geographic space

  # Where household locations/characteristics come from.
  # "generate": create them synthetically in-process (see characteristic_field)
  # "file": read a world file produced by generate_world.py — see
  #         heatpump_sim/world.py for the format (required columns:
  #         id,x,y,characteristic; descriptive columns carried through)
  location_source: file
  households_source_file: worlds/model_town.csv

  # Controls the synthetic spatial field used to generate the demographic/
  # economic "characteristic" number (0-1) so that nearby households tend
  # to have similar values.
  characteristic_field:
    n_centers: 8          # number of random spatial "hotspots" summed to build the field
    length_scale: 0.3      # how quickly influence of a hotspot decays with distance
    noise_std: 0.15         # random noise added on top of the smooth spatial field

# Who can adopt, when they consider it, and how likely they are to say yes.
adoption:
  initial_fraction: 0.01     # ~1% of homes have a heat pump today
  initial_owners: top        # top: first owners drawn from the top_pool_fraction by
                             # characteristic; random: drawn from everyone
  top_pool_fraction: 0.10
  trigger_rate: 0.0055555556 # chance a month that a non-owner reconsiders its heating
                             # (boiler replacement, moving, renovation): 1/180, a
                             # ~15-year boiler life
  capability_gate: 0.30      # households with characteristic below this can never adopt
  half_point: 0.8            # motivation at which a triggered household adopts with
                             # probability 1/2 ...
  characteristic_weight: 0.2 # ... lowered by characteristic_weight * characteristic
  slope: 0.07                # how sharply adoption probability rises with motivation

motivation:
  baseline_mean: 0.3         # households' own starting motivation; calibrated so that
  baseline_sd: 0.15          # year-1 installs are ~0.3% of homes a year
  memory: 0.05               # share of the gap back to baseline closed each month

# Only owners talk; see heatpump_sim/dynamics.py.
word_of_mouth:
  contact_rate: 0.72         # chance a month an owner talks to each contact (DESIGN.md)
  message_strength: 0.06     # share of the gap to 1 a positive message closes (calibrated)
  # Option A, complex contagion: >1 makes several voices count for more than one.
  # Michael's runs used 1.5-2, recalibrating message_strength to keep the pace.
  complex_contagion_beta: 1.0
  complex_contagion_reference: 2
  # Option B: a message from an owner in a different building type counts
  # (1 - this). Michael's runs used 0.5-0.9.
  similar_home_credibility: 0.0

# Owners with a bad experience (the negative word-of-mouth lever).
dissatisfaction:
  share: 0.0                 # chance a new owner is dissatisfied (q)
  weight: 1.0                # a complaint counts as this many positive messages, reversed (w)
  duration_months: null      # mean months a dissatisfied owner keeps complaining before
                             # falling silent; null = forever

# ---------------------------------------------------------------------------
# Stage one: synthetic world generation (generate_world.py). Only read by the
# generator — the simulation above never looks at this section, it just reads
# whatever world file it is pointed at.
# ---------------------------------------------------------------------------
world_generation:
  seed: 7
  n_households: 400          # used only when households_per_cell is unset
  households_per_cell: 694   # LSOA-sized cells: ~23.4M households in England
                             # (Census 2021) over 33,755 LSOAs. Set to null to
                             # fall back to n_households for small test worlds.
  space_size: [1.0, 1.0]
  grid: [4, 4]        # rows, cols of LSOA-like cells tiling the model town
  mixing: 0.3         # 0 = clean affluence gradient across the grid,
                      # 1 = archetypes scattered at random. The "how
                      # segregated is this town" knob; sweep it like any other.
  output_file: worlds/model_town.csv

  # How the [0, 1] capability number is composed from drawn attributes.
  capability:
    weights:           # normalised internally, so only the ratios matter
      income: 0.5
      tenure: 0.3
      building: 0.2
    noise_std: 0.05    # household-level variation within an archetype

    # PLACEHOLDER SCORES — revisit with Michael before drawing conclusions.
    # social_rented is genuinely ambiguous here: those households have the
    # least decision-making power over their own heating, but are also the
    # explicit target of the fully-funded installation scheme. Which way it
    # should score depends on whether we are modelling "can choose to
    # install" or "is likely to end up with one".
    tenure_scores:
      owner_occupied: 1.0
      social_rented: 0.40
      private_rented: 0.25
    building_scores:
      detached: 1.0
      semi_detached: 0.85
      terraced: 0.60
      flat: 0.15

  # Six LSOA types from k-means on England's 33,755 LSOAs (analysis/lsoa_types.py),
  # as household-weighted profiles: income_decile_range is the 25th-75th
  # percentile. Order does not matter; they are sorted by mean income decile
  # when laid out on the grid. Rebuild from the national LSOA table with
  # analysis/derive_archetypes.py.
  archetypes:
    - name: t0_mixed_terraced
      share: 0.21051181497304988
      income_decile_range: [3, 6]
      tenure_mix:   {owner_occupied: 0.5918555148564593, private_rented: 0.2724045057859955, social_rented: 0.13573997935754517}
      building_mix: {detached: 0.12390328557548488, semi_detached: 0.24614925929286904, terraced: 0.38763989769244867, flat: 0.24230755743919744}
    - name: t1_city-centre_flats
      share: 0.10092888025964425
      income_decile_range: [3, 7]
      tenure_mix:   {owner_occupied: 0.3729337781872469, private_rented: 0.4789681574779201, social_rented: 0.14809806433483308}
      building_mix: {detached: 0.04042408958346336, semi_detached: 0.08607186228023961, terraced: 0.18833048539517025, flat: 0.685173562741127}
    - name: t2_suburban_rural_detached
      share: 0.2765301447550905
      income_decile_range: [7, 9]
      tenure_mix:   {owner_occupied: 0.8067643356793528, private_rented: 0.1275980661769459, social_rented: 0.06563759814370129}
      building_mix: {detached: 0.5296593363932568, semi_detached: 0.27081495848347475, terraced: 0.12497285892927244, flat: 0.07455284619399599}
    - name: t3_social_flats
      share: 0.06688694822386367
      income_decile_range: [1, 2]
      tenure_mix:   {owner_occupied: 0.2698616574545582, private_rented: 0.24164484221227886, social_rented: 0.4884935003331629}
      building_mix: {detached: 0.030206744059028866, semi_detached: 0.09969897634687164, terraced: 0.2088543706990914, flat: 0.661239908895008}
    - name: t4_social_estates
      share: 0.14545013034823634
      income_decile_range: [1, 3]
      tenure_mix:   {owner_occupied: 0.4556147459027806, private_rented: 0.15194757519799598, social_rented: 0.3924376788992234}
      building_mix: {detached: 0.08244428446194964, semi_detached: 0.42243274824366583, terraced: 0.32430381603292363, flat: 0.17081915126146086}
    - name: t5_urban_owner-occupied_semis
      share: 0.19969208144011535
      income_decile_range: [5, 8]
      tenure_mix:   {owner_occupied: 0.7688766751166043, private_rented: 0.13354595408445472, social_rented: 0.09757737079894102}
      building_mix: {detached: 0.1925116674537308, semi_detached: 0.5574447499408868, terraced: 0.1668051832200312, flat: 0.08323839938535114}

network:
  type: spatial_kernel   # spatial_kernel | preferential_attachment | random | small_world
  # Central values and sweep ranges from the network review in the 26 Aug
  # briefing. Local ties form with probability proportional to
  # exp(-distance / decay_length_m), scaled to hit mean_degree; a further
  # long_range_fraction of ties are placed ignoring geography.
  params:
    mean_degree: 15            # swept 5-20; Dunbar sympathy group (an analogue)
    decay_length_m: 210        # swept 100-500; Barton-Henry et al. 2021 (Fresno solar)
    long_range_fraction: 0.30  # swept 0.1-0.5; Liben-Nowell et al. 2005
    metres_per_unit: 2000      # PLACEHOLDER physical scale of the world: 1.0 in world
                               # coordinates is this many metres. At 2000 the 4x4 town
                               # is 2 km across with 500 m cells; revisit once real
                               # LSOA areas are available.
    # preferential_attachment: {m: 3}  (unrealistic comparator only)
    # random:                  {p: 0.05}
    # small_world:             {k: 4, p: 0.1}

  # true: shuffle who is tied to whom, keeping each household's number of ties
  # (a null for "does the network's structure matter?")
  rewire: false

output:
  results_dir: results
  animation: adoption_animation.gif
  animation_every_months: 3   # one frame per this many months
  fps: 8
